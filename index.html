<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Interbanks Football Tournament 2026 – Group Stage</title>
<style>
:root{--bg:#070b16;--p:#101830;--p2:#16213f;--tx:#eef2ff;--mu:#8e9bc4;--gold:#f5c542;--sil:#c0c8d8;--bro:#cd7f32;--y:#ffd21f;--r:#e5322d;--ac:#2ee6a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 500px at 50% -100px,#1b2c5e,var(--bg));color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:28px 20px 10px;text-align:center}
h1{margin:0;font-size:clamp(26px,5vw,52px);letter-spacing:2px;text-transform:uppercase;font-weight:900;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin-top:6px}.prov{display:inline-block;margin-top:10px;padding:4px 12px;border:1px solid var(--gold);color:var(--gold);border-radius:99px;font-size:12px;letter-spacing:1px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:#070b16ee;z-index:5}
nav button{background:var(--p);color:var(--mu);border:1px solid #243157;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on{background:var(--ac);color:#04130d;border-color:var(--ac)}
main{max-width:1200px;margin:auto;padding:8px 16px 60px}section{display:none}section.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid #243157;border-radius:14px;padding:16px}
.k b{display:block;font-size:40px;line-height:1;font-weight:900}.k span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:1px}.k small{display:block;color:var(--mu);margin-top:6px}
h2{margin:26px 0 10px;font-size:20px;text-transform:uppercase;letter-spacing:1.5px}h2:before{content:"";display:inline-block;width:6px;height:18px;background:var(--ac);margin-right:10px;border-radius:2px;vertical-align:-2px}
.card{background:var(--p);border:1px solid #243157;border-radius:14px;padding:14px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;flex:none;border:2px solid #ffffff55}
.tm{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.mt{background:var(--p);border:1px solid #243157;border-radius:12px;padding:10px 12px}.mt .hd{color:var(--mu);font-size:11px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}.row .nm{flex:1;min-width:0;font-size:13px;font-weight:600}.row .sc{font-size:26px;font-weight:900;min-width:30px;text-align:center}
.w .nm,.w .sc{color:var(--ac)}.sc2{font-size:11px;color:var(--mu);margin-top:6px}.fl{color:var(--gold)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar .lb{width:170px;font-size:13px;display:flex;gap:8px;align-items:center}.bar .tr{flex:1;background:#0b1226;border-radius:6px;height:22px;display:flex;overflow:hidden}.bar .tr i{display:block;height:100%}.bar .v{width:54px;font-weight:800;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;text-align:center;border-bottom:1px solid #1d2a50}th{color:var(--mu);font-size:11px;text-transform:uppercase}td:nth-child(2),th:nth-child(2){text-align:left}
tr.q td{background:#2ee6a615}.gd{background:linear-gradient(135deg,#3b2d05,var(--p));border-color:var(--gold)}
.sel{background:var(--p);color:var(--tx);border:1px solid #243157;padding:8px;border-radius:8px;margin:0 8px 8px 0}
.tl{position:relative;height:90px;margin:10px 8px 30px;background:linear-gradient(90deg,#0d3b27,#0f4a31);border:1px solid #1d6b49;border-radius:8px}
.tl .ht{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed #ffffff55}.tl .mk{position:absolute;transform:translate(-50%,0);text-align:center;font-size:10px;width:70px}.tl .mk i{display:block;margin:0 auto;width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.axis{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin:-24px 8px 14px}
.cc{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px}.note{color:var(--mu);font-size:12px;margin:6px 0}
.sc-w{overflow-x:auto}header{position:relative;padding:54px 20px 8px;text-align:center}.tis{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top,0px));height:34px;background:#fff;border-radius:6px;padding:3px 6px}.kba{display:inline-block;background:#fff;border-radius:14px;padding:10px 22px;margin-top:14px}.kba img{display:block;height:92px;width:auto}.tag{margin-top:12px;margin-bottom:6px;font-size:clamp(15px,3vw,22px);font-weight:800;letter-spacing:6px;color:var(--gold)}
.bkw{overflow-x:auto}.bk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;min-width:780px}.bkc{display:flex;flex-direction:column;justify-content:space-around;gap:14px}.bkc h3{margin:0 0 2px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.bx{background:var(--p);border:1px solid #243157;border-radius:10px;padding:6px 10px}.bx .br{display:flex;align-items:center;gap:8px;padding:3px 0}.bx .br .nm{font-size:13px;font-weight:600}.bx .br b{margin-left:auto;font-size:20px}.bx .br.w .nm,.bx .br.w b{color:var(--ac)}.bx small{color:var(--mu);font-weight:600}.bx .ml{color:var(--mu);font-size:11px}
.fin{border-color:var(--gold);background:linear-gradient(160deg,#3b2d05,var(--p))}
.ch{display:inline-block;padding:1px 7px;border-radius:5px;font-size:12px;margin:2px 4px 2px 0;background:#0b1226;border:1px solid #243157}.ch i{display:inline-block;width:8px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
.kc h4{margin:8px 0 2px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}.kc .big{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.kc .big .t{display:flex;align-items:center;gap:8px;flex:1;font-weight:700}.kc .big .t:last-child{justify-content:flex-end;text-align:right}.kc .big .z{font-size:28px;font-weight:900;white-space:nowrap}
.lg{background:#fff;border-radius:6px;padding:2px;object-fit:contain;height:30px;width:52px;flex:none}.lg.mid{height:52px;width:96px;padding:4px}.lg.big{height:72px;width:110px;padding:4px;border-radius:10px}
</style></head><body>

const sc={};pit.filter(g=>g.ty!='Own goal').forEach(g=>{const k=g.p+'|'+g.pt;sc[k]=sc[k]||{p:g.p,t:g.pt,n:0,pen:0,ms:{}};sc[k].n++;if(g.ty=='Penalty')sc[k].pen++;sc[k].ms[g.m]=(sc[k].ms[g.m]||0)+1});
const SC=Object.values(sc).sort((a,b)=>b.n-a.n||a.p.localeCompare(b.p));
let r=0,pv=null;SC.forEach((s,i)=>{if(s.n!=pv){r=i+1;pv=s.n}s.r=r});
const cy=D.filter(d=>d.c=='Caution'&&d.role=='Player'),cr=D.filter(d=>d.c=='Red card'&&d.role=='Player'),of=D.filter(d=>d.role!='Player');
const cardT={};teams.forEach(t=>cardT[t]={y:0,r:0,o:0});D.forEach(d=>{cardT[d.team][d.role=='Player'?(d.c=='Caution'?'y':'r'):'o']++});
const bars=(rows,max,fmt=x=>x)=>rows.map(x=>`<div class="bar"><div class="lb">${x.l}</div><div class="tr">${x.s.map(s=>`<i style="width:${s.v/max*100}%;background:${s.c}"></i>`).join('')}</div><div class="v">${fmt(x.v)}</div></div>`).join('');
const pe=n=>M.filter(m=>m.t=='Played').length;
function overview(){
 const tot=pit.length,top=SC[0],hi=[...played].sort((a,b)=>goalsM(b.m).length-goalsM(a.m).length)[0];
 const gfs=[...teams].sort((a,b)=>gf[b]-gf[a])[0];
 const mx=[...M].filter(m=>m.t!='Walkover'&&m.t!='Awarded on appeal').sort((a,b)=>(b.hs+b.as_)-(a.hs+a.as_))[0];
 return `<div class="kpis">
 <div class="k"><span>Fixtures</span><b>${M.length}</b><small>${played.length} played (6 knockout) · ${M.length-played.length} walkovers</small></div>
 <div class="k"><span>Goals on the pitch</span><b>${tot}</b><small>from ${played.length} played matches</small></div>
 <div class="k"><span>Goals / match</span><b>${(tot/played.length).toFixed(2)}</b><small>played matches only</small></div>
 <div class="k"><span>Yellow cards</span><b style="color:var(--y)">${cy.length}</b><small>players</small></div>
 <div class="k"><span>Red cards</span><b style="color:var(--r)">${cr.length}</b><small>players · +${of.length} to officials</small></div>
 <div class="k gd"><span>Leading scorer</span><b>${top.n}</b><small>${top.p} (${top.t})</small></div>
 <div class="k"><span>Top scoring team</span><b>${gf[gfs]}</b><small>${teams.filter(t=>gf[t]==gf[gfs]).join(' &amp; ')}</small></div>
 <div class="k"><span>Highest-scoring match</span><b>${mx.hs}–${mx.as_}</b><small>#${mx.m} ${mx.h} v ${mx.a}</small></div></div>
 ${(()=>{const row=(n,f)=>{const ids=new Set(M.filter(m=>f(m)&&m.t!='Walkover').map(m=>m.m)),gl=pit.filter(g=>ids.has(g.m)).length,cs=D.filter(d=>ids.has(d.m)),c='style="text-align:center"';return `<tr><td style="text-align:left">${n}</td><td ${c}>${ids.size}</td><td ${c}>${gl}</td><td ${c}>${(gl/ids.size).toFixed(2)}</td><td ${c}>${cs.filter(d=>d.c=='Caution'&&d.role=='Player').length}</td><td ${c}>${cs.filter(d=>d.c=='Red card'&&d.role=='Player').length}</td></tr>`};return `<h2>By stage</h2><div class="card sc-w"><table><tr><th style="text-align:left">Stage</th><th style="text-align:center">Matches played</th><th style="text-align:center">Goals</th><th style="text-align:center">Per match</th><th style="text-align:center">Yellow</th><th style="text-align:center">Red</th></tr>${row('Group stage',m=>!m.ko)}${row('Knockouts (to semi-finals)',m=>m.ko)}</table></div>`})()}
 <h2>Participating banks</h2><div class="card" style="display:flex;flex-wrap:wrap;gap:10px 18px">${teams.map(t=>`<div style="text-align:center;width:104px">${bd(t,'mid')}<div class="note" style="margin:4px 0 0">${t}</div></div>`).join('')}</div>
 <p class="note">Bank logos are the official files supplied for the tournament. Dates and venues are only available for knockout matches (see Knockouts); the final is on 16 Oct 2026, 15:00, at ABSA Sports Club. “Goals on the pitch” excludes 12 goals awarded in walkovers and the annulled goal in match 13; the league tables use the official awarded scores (282 goals in total).</p>`}
function grp(){return results()+grpTables()}
function results(){
 const o='<option value="">All teams</option>'+teams.map(t=>`<option>${t}</option>`).join('');
 return `<select class="sel" id="ft">${o}</select><select class="sel" id="fg"><option value="">All groups</option>${'ABCD'.split('').map(x=>`<option>${x}</option>`).join('')}</select><div class="grid" id="mg"></div>`}
function drawM(){
 const t=ft.value,g=fg.value;
 mg.innerHTML=M.filter(m=>!m.ko).filter(m=>(!t||m.h==t||m.a==t)&&(!g||m.g==g)).map(m=>{
  const gs=goalsM(m.m).map(x=>`${x.p}${x.ty=='Penalty'?' (pen)':x.ty=='Own goal'?' (OG)':''}${x.min!=null?` ${x.min}'`:''}`);
  const side=s=>goalsM(m.m).filter(x=>x.team==s).map(x=>`${x.p.startsWith('Own goal (')?'OG':x.p}${x.ty=='Penalty'?' (p)':x.ty=='Own goal'&&!x.p.startsWith('Own')?' (og)':''}${x.min!=null?' '+x.min+"'":''}`).join(', ');
  const hw=m.hs>m.as_,aw=m.as_>m.hs;
  return `<div class="mt"><div class="hd"><span>Match ${m.m} · Group ${m.g}</span><span>${m.t=='Played'?'FT':m.t=='Walkover'?'Walkover (2–0 award)':'Awarded on appeal'}</span></div>
  <div class="row ${hw?'w':''}">${bd(m.h)}<span class="nm">${m.h}</span><span class="sc">${m.hs}</span></div>
  <div class="row ${aw?'w':''}">${bd(m.a)}<span class="nm">${m.a}</span><span class="sc">${m.as_}</span></div>
  <div class="sc2">${m.t=='Played'?(side(m.h)?'<b>'+ab(m.h)+':</b> '+side(m.h):'')+(side(m.a)?'<br><b>'+ab(m.a)+':</b> '+side(m.a):''):m.t=='Awarded on appeal'?'Report showed 1–0 to '+m.h+'; goal annulled on appeal':''}${m.m==33?'<br><span class="fl">Tisini capture: 3–1 · report &amp; official: 2–1</span>':''}</div></div>`}).join('')}
function boot(){
 const top=SC.slice(0,12),mx=top[0].n,medal=r=>r==1?'var(--gold)':r==2?'var(--sil)':r==3?'var(--bro)':'var(--ac)';
 const L=SC[0];
 return `<div class="card gd" style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${bd(L.t,'big')}<div><div class="fl">🥇 GOLDEN BOOT LEADER</div><div style="font-size:26px;font-weight:900">${L.p}</div><div>${L.t} · <b>${L.n} goals</b> (${L.pen} penalty) · in ${Object.keys(L.ms).length} matches</div></div></div>
 <div class="card">${bars(top.map(s=>({l:`<b style="color:${medal(s.r)}">${s.r}</b>${bd(s.t)}<span>${s.p}</span>`,v:s.n,s:[{v:s.n,c:medal(s.r)}]})),mx)}</div>
 <h2>Scorer detail</h2><div class="card sc-w"><table><tr><th>Rank</th><th>Player</th><th>Team</th><th>Goals</th><th>Pens</th><th>By match (goals)</th></tr>${SC.filter(s=>s.n>=3).map(s=>`<tr><td>${s.r}</td><td>${s.p}</td><td>${s.t}</td><td><b>${s.n}</b></td><td>${s.pen}</td><td style="text-align:left">${Object.entries(s.ms).map(([m,n])=>ML(+m)+': '+n).join(' · ')}</td></tr>`).join('')}</table></div>
 <p class="note">Ties share a rank. Own goals are credited to the opposing team, not to a scorer. Players with 3+ goals shown; hat-tricks and better in one match: ${SC.flatMap(s=>Object.entries(s.ms).filter(([m,n])=>n>=3).map(([m,n])=>`${s.p} (${n}, ${ML(+m)})`)).join('; ')}.</p>`}
function teamsV(){
 const rows=[...teams].sort((a,b)=>gf[b]-gf[a]),mx=gf[rows[0]];
 return `<h2>Goals scored · group stage + knockouts</h2><div class="card">${bars(rows.map(t=>({l:tm(t),v:gf[t],s:[{v:gf[t],c:COL[t]=='#111111'?'#7b8bb8':COL[t]}]})),mx)}</div>
 <p class="note">Goals on the pitch from group stage and knockouts (excludes walkover and appeal awards and penalty shoot-outs).</p>`}
function grpTables(){
 return `<h2>Group tables (official scores)</h2>${'ABCD'.split('').map(g=>`<div class="card sc-w" style="margin-bottom:10px"><b>Group ${g}</b><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>${T.filter(t=>t.gr==g).map(t=>`<tr class="${t.st=='Through'?'q':''}"><td>${t.pos}</td><td>${tm(t.team)}</td><td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td><td>${t.GF}</td><td>${t.GA}</td><td>${t.GD>0?'+':''}${t.GD}</td><td><b>${t.Pts}</b></td></tr>`).join('')}</table></div>`).join('')}
 <p class="note">Highlighted rows are marked “Through” in the workbook. Table figures include walkover awards (2–0) and the appeal award in match 13, so they differ from the on-pitch goal counts on the Teams tab. Group sizes differ (5–7 teams); points are as supplied.</p>`}

function disc(){
 const rows=[...teams].sort((a,b)=>(cardT[b].y+cardT[b].r*2)-(cardT[a].y+cardT[a].r*2)||cardT[b].r-cardT[a].r);
 const mx=Math.max(...rows.map(t=>cardT[t].y+cardT[t].r+cardT[t].o));
 const pc={};D.filter(d=>d.role=='Player').forEach(d=>{const k=d.player=d.p;pc[k]=pc[k]||{p:d.p,t:d.team,y:0,r:0};d.c=='Caution'?pc[k].y++:pc[k].r++});
 const pl=Object.values(pc).sort((a,b)=>b.y-a.y||b.r-a.r).slice(0,10);
 const sw=c=>`<span class="cc" style="background:${c}"></span>`;
 return `<div class="kpis"><div class="k"><span>Yellow (players)</span><b style="color:var(--y)">${cy.length}</b></div><div class="k"><span>Red (players)</span><b style="color:var(--r)">${cr.length}</b></div><div class="k"><span>Officials carded</span><b>${of.length}</b><small>${of.map(o=>o.c+' – '+o.team).join('; ')}</small></div></div>
 <h2>Cards by bank</h2><div class="card">${bars(rows.map(t=>({l:tm(t),v:cardT[t].y+cardT[t].r+cardT[t].o,s:[{v:cardT[t].y,c:'var(--y)'},{v:cardT[t].r,c:'var(--r)'},{v:cardT[t].o,c:'#8e9bc4'}]})),mx)}<p class="note">${sw('var(--y)')} yellow ${sw('var(--r)')} red ${sw('#8e9bc4')} card to a coach/official. Sorted by yellow + 2×red.</p></div>
 <h2>Most cautioned players</h2><div class="card sc-w"><table><tr><th>#</th><th>Player</th><th>Team</th><th>Yellow</th><th>Red</th></tr>${pl.map((p,i)=>`<tr><td>${i+1}</td><td>${p.p}</td><td>${p.t}</td><td>${p.y}</td><td>${p.r}</td></tr>`).join('')}</table></div>
 <h2>Red cards</h2><div class="card sc-w"><table><tr><th>Match</th><th>Team</th><th>Who</th><th>Reason</th></tr>${D.filter(d=>d.c=='Red card').map(d=>`<tr><td>${ML(d.m)}</td><td style="text-align:left">${d.team}</td><td style="text-align:left">${d.p}${d.role!='Player'?' (official)':''}</td><td style="text-align:left">${d.why||'—'}</td></tr>`).join('')}</table></div>
 <p class="note">A player's second yellow is logged as a red card in the report; it is counted once as a red and the preceding caution may also be listed.</p>`}
function tline(){return `<select class="sel" id="tsel">${M.filter(m=>m.t=='Played'&&goalsM(m.m).length).map(m=>`<option value="${m.m}">${ML(m.m)} ${m.h} v ${m.a} (${m.hs}–${m.as_})</option>`).join('')}</select><div id="tlv"></div><p class="note">Only goals with a recorded minute are plotted; matches with no minutes (e.g. #18, 20, 22, 34, 42, 47, 51, 68, 73, 78) list goals without positions. Own goals plot for the credited team.</p>`}
function drawT(){
 const m=M.find(x=>x.m==tsel.value),gs=goalsM(m.m),w=gs.filter(g=>g.min!=null),nm=gs.length-w.length;
 const mk=g=>{const l=Math.min(g.min,90)/90*100,h=g.team==m.h;return `<div class="mk" style="left:${l}%;${h?'top:6px':'bottom:-2px'}"><i style="background:${COL[g.team]=='#111111'?'#7b8bb8':COL[g.team]}"></i>${g.min}' ${g.p.replace(/Own goal.*/,'OG')}${g.ty=='Own goal'?' (OG)':''}${g.ty=='Penalty'?' (P)':''}</div>`};
 tlv.innerHTML=`<div class="card"><div class="row"><span class="tm">${tm_(m.h)}</span><span class="sc">${m.hs}–${m.as_}</span><span class="tm">${tm_(m.a)}</span></div><div class="tl"><div class="ht"></div>${w.map(mk).join('')}</div><div class="axis"><span>0'</span><span>HT 45'</span><span>90'</span></div><div class="note">Top: ${m.h} · Bottom: ${m.a}. ${nm?nm+' goal(s) have no recorded minute.':'All goal minutes recorded.'} Late goals (80'+): ${w.filter(g=>g.min>=80).map(g=>g.p+' '+g.min+"'").join(', ')||'none'}.</div></div>`}
const tm_=t=>bd(t)+'<b>'+t+'</b>';
function dq(){
 const miss=pit.filter(g=>g.min==null).length,mm=new Set(pit.filter(g=>g.min==null).map(g=>g.m)).size;
 return `<div class="card"><table><tr><th>Check</th><th style="text-align:left">Result</th></tr>
 <tr><td>Reports</td><td style="text-align:left">72 of 72 played matches have a report; 6 walkovers have none (awarded 2–0).</td></tr>
 <tr><td>Goal list vs score</td><td style="text-align:left">Reconciles in all 72 played matches (268 goals logged = official scores after the match 13 appeal).</td></tr>
 <tr><td>Match 13</td><td style="text-align:left">Report: ${'Bank of Africa'} 1–0 ABSA; goal annulled on appeal; official result ABSA 2–0 (awarded). Annulled goal not counted.</td></tr>
 <tr><td>Match 33</td><td style="text-align:left">Tisini capture 3–1 vs report/official 2–1. Official used.</td></tr>
 <tr><td>Goal minutes</td><td style="text-align:left">${miss} of ${pit.length} goals (${mm} matches) have no minute – excluded from timelines and late-goal checks.</td></tr>
 <tr><td>Unnamed scorer</td><td style="text-align:left">Match 20: one own goal by an Ecobank player, name not given.</td></tr>
 <tr><td>Cards</td><td style="text-align:left">123 cautions + 13 reds logged; 3 went to officials (1 caution, 2 red). Group-stage player totals of 122 cautions and 11 reds match the workbook summary; knockouts add 17 yellows, 3 player reds and 1 red to an assistant coach.</td></tr>
 <tr><td>Unclear entries</td><td style="text-align:left">Match 4 Kingdom Bank caution reason written “RX:DR (unclear)”; some reasons and minutes blank.</td></tr>
 <tr><td>KO: shirt/minute gaps</td><td style="text-align:left">Only QF2 goals have minutes (QF1, QF3, QF4, SF1 and SF2 goals have none). QF2 first goal (Oporia Bill, 7') has no shirt number, and several players in other matches have no shirt number or minute.</td></tr>
 <tr><td>KO: name matching</td><td style="text-align:left">Knockout reports write names surname-first and with spelling variants. For the combined tabs, names were matched to group-stage players on the same team: exact matches (e.g. Ayodi Frank = Frank Ayodi) and close spellings assumed the same person: Franklin/Frankline Ochieng, Johny/John Mwendwa, Bernard/Benard Kubasu, Aggrey Mukwambo/Mukuambo Agrey, Chrispinus/Chrispinas Masiga, Melekh Ogoto/Ogoyo, Kelvin/Kevin Kioko, Wickliffe/Wycliffe Wasonga. Denzel Shihundu (Caritas) is ambiguous and not merged. The Knockouts tab shows names as written.</td></tr>
 <tr><td>KO: Kioko</td><td style="text-align:left">Equity scorer is “Kioko Kelvin” in QF4 and “Kioko Kevin” (#2, pk) in SF2; counted as one player (Kelvin Kioko). “pk” on the SF2 goal is read as a penalty.</td></tr>
 <tr><td>KO: KB Sacco</td><td style="text-align:left">Reports say “KB Sacco”; shown with The Kenya Bankers’ logo and standings from the group stage – confirm they are the same team.</td></tr>
 <tr><td>KO: final</td><td style="text-align:left">No final date or result supplied, so none is shown. Equity v I&amp;M went to penalties: I&amp;M won 5–4.</td></tr></table></div>`}

const koG=(m,x)=>m.g.filter(g=>g.s==x).map(g=>`${g.p}${g.no?' #'+g.no:''}${g.min?' '+g.min+"'":''}${g.ty=='pk'?' (pk)':''}`).join(', ');
function koBox(id){const m=KO.find(x=>x.id==id),w=koW(m);
 const r=(t,sc,pn)=>`<div class="br ${w==t?'w':''}">${bd(t)}<span class="nm">${KN(t)}</span><b>${sc}${m.pen?` <small>(${pn})</small>`:''}</b></div>`;
 return `<div class="bx">${r(m.h,m.hs,m.pen&&m.pen[0])}${r(m.a,m.as,m.pen&&m.pen[1])}<div class="ml">${m.id}${m.pen?' · won on penalties':''}</div></div>`}
function koCard(m){const w=koW(m);
 const ch=x=>m.c.filter(c=>c.s==x).map(c=>`<span class="ch"><i style="background:${c.k=='R'?'var(--r)':'var(--y)'}"></i>${c.p}${c.no?' #'+c.no:''}${c.min?' '+c.min+"'":''}${c.off?' ('+c.off+')':''}</span>`).join('')||'<span class="note">none recorded</span>';
 const sec=(t,x)=>`<h4>${KN(t)}</h4><div class="note" style="margin:0;color:var(--tx)">${koG(m,x)||'–'}</div>${ch(x)}`;
 return `<div class="card kc"><div class="note" style="margin:0">${m.id} · ${m.rd} · ${m.date}${m.venue?' · '+m.venue:''}</div>
 <div class="big"><span class="t">${bd(m.h)}<span>${KN(m.h)}</span></span><span class="z">${m.hs} – ${m.as}${m.pen?`<br><small style="font-size:13px;color:var(--mu)">pens ${m.pen[0]}–${m.pen[1]}</small>`:''}</span><span class="t"><span>${KN(m.a)}</span>${bd(m.a)}</span></div>
 <div class="note" style="margin:0">Winner: <b style="color:var(--ac)">${KN(w)}</b></div>${sec(m.h,'h')}${sec(m.a,'a')}</div>`}
function ko(){
 const gl=KO.reduce((a,m)=>a+m.hs+m.as,0),cd=KO.flatMap(m=>m.c),yc=cd.filter(c=>c.k=='Y').length,rc=cd.filter(c=>c.k=='R'&&!c.off).length,ro=cd.filter(c=>c.off).length;
 const sc={};KO.forEach(m=>m.g.forEach(g=>{const t=g.s=='h'?m.h:m.a;const k=g.p+'|'+t;sc[k]=sc[k]||{p:g.p,t,n:0};sc[k].n++}));
 const SK=Object.values(sc).sort((a,b)=>b.n-a.n||a.p.localeCompare(b.p));
 return `<div class="kpis"><div class="k"><span>Matches</span><b>${KO.length}</b><small>4 QF · 2 SF</small></div><div class="k"><span>Goals</span><b>${gl}</b><small>${(gl/KO.length).toFixed(1)} per match · excl. shoot-out</small></div><div class="k"><span>Yellow cards</span><b style="color:var(--y)">${yc}</b></div><div class="k"><span>Red cards</span><b style="color:var(--r)">${rc}</b><small>players · +${ro} assistant coach</small></div><div class="k gd"><span>Final</span><b style="font-size:20px;line-height:1.2">KB Sacco v I&amp;M Bank</b><small>Fri 16 Oct 2026 · 15:00 · ABSA Sports Club</small></div></div>
 <h2>Road to the final</h2><div class="card bkw"><div class="bk">
  <div class="bkc"><h3>Quarter-finals</h3>${['QF3','QF1','QF4','QF2'].map(koBox).join('')}</div>
  <div class="bkc"><h3>Semi-finals</h3>${koBox('SF1')}${koBox('SF2')}</div>
  <div class="bkc"><h3>Final</h3><div class="bx fin"><div class="br">${bd('The Kenya Bankers')}<span class="nm">KB Sacco</span></div><div class="br">${bd('I & M Bank')}<span class="nm">I&amp;M Bank</span></div><div class="ml">Fri 16 Oct 2026 · 15:00 · ABSA Sports Club</div></div></div>
 </div></div>
 <h2>Match results</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${KO.map(koCard).join('')}</div>
 <h2>Knockout scorers</h2><div class="card sc-w"><table><tr><th>#</th><th>Player</th><th>Team</th><th>Goals</th></tr>${SK.map((s,i)=>`<tr><td>${i+1}</td><td>${s.p}</td><td>${KN(s.t)}</td><td><b>${s.n}</b></td></tr>`).join('')}</table></div>
 <p class="note">Knockout goals and cards are also included in the tournament totals on Overview, Golden Boot, Teams, Discipline and Timeline. Names here are as written in the reports. “KB Sacco” is treated as The Kenya Bankers.</p>`}

const TABS=[['Overview',overview],['Group Stage',grp],['Knockouts',ko],['Golden Boot',boot],['Teams',teamsV],['Discipline',disc],['Timeline',tline]];
nav.innerHTML=TABS.map((t,i)=>`<button data-i="${i}">${t[0]}</button>`).join('');
main.innerHTML=TABS.map((t,i)=>`<section id="s${i}">${t[1]()}</section>`).join('');
function go(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',j==i));document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',j==i))}
nav.onclick=e=>{if(e.target.dataset.i!=null)go(+e.target.dataset.i)};
ft.onchange=fg.onchange=drawM;tsel.onchange=drawT;drawM();drawT();go(0);
</script></body></html>
